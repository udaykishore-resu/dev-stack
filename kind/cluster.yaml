# kind cluster for the guest-platform stack.
#
#   kind create cluster --config kind/cluster.yaml      (or: make kind-up)
#
# Single node. Splitting control plane and workers on a laptop costs memory
# and buys nothing — there is no HA to test and no scheduling spread to
# observe with one replica of everything.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: guest-platform

# ---------------------------------------------------------------------------
# vm.max_map_count for Elasticsearch.
#
# Lucene memory-maps segment files and ES 8 refuses to start below 262144
# mmap regions. This is a NODE-level kernel setting; it cannot be set from an
# unprivileged pod, and a privileged initContainer would violate the
# `restricted` Pod Security Standard we enforce on the namespace.
#
# On Linux the kind node container shares the host kernel, so this must also
# be set on the HOST:
#     sudo sysctl -w vm.max_map_count=262144
# On Docker Desktop for macOS the VM already ships with 262144.
# See elasticsearch/README.md.
# ---------------------------------------------------------------------------

nodes:
  - role: control-plane

    # ingress-nginx's kind manifest selects nodes with this label and tolerates
    # the control-plane taint. Without the label the controller stays Pending
    # and every ingress URL 404s with no obvious cause.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    extraPortMappings:
      # 80/443 on the host go straight to ingress-nginx's hostPorts in the
      # node, so http://guest-score.localtest.me works with no port-forward
      # and no NodePort in the URL.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 443
        protocol: TCP
        listenAddress: "127.0.0.1"

      # Direct access to the infra services for psql / redis-cli / curl /
      # mosquitto_sub from the host, without `kubectl port-forward` in another
      # terminal. These map to the NodePorts declared below.
      #
      # They are offset by +10000 from the real ports (15432 not 5432) ON
      # PURPOSE: the compose stack usually owns 5432/6379/9200/1883 at the same
      # time, and a clash there is a confusing failure — you connect
      # successfully, to the wrong database.
      - containerPort: 30432
        hostPort: 15432
        protocol: TCP
        listenAddress: "127.0.0.1"
      - containerPort: 30379
        hostPort: 16379
        protocol: TCP
        listenAddress: "127.0.0.1"
      - containerPort: 30920
        hostPort: 19200
        protocol: TCP
        listenAddress: "127.0.0.1"
      - containerPort: 30883
        hostPort: 11883
        protocol: TCP
        listenAddress: "127.0.0.1"

# Cluster-wide feature/config knobs.
networking:
  # Default is 127.0.0.1 with a random port; pinning it keeps the kubeconfig
  # stable across recreates.
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  # kindnet is fine here. Swap for Calico only if you want to test the
  # NetworkPolicies that overlays/prod does not yet ship.
  disableDefaultCNI: false
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
