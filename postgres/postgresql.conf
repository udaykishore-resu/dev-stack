# PostgreSQL 17 — laptop-sized tuning for dev-stack.
#
# This file REPLACES the image's generated postgresql.conf (the container is
# started with `-c config_file=/etc/postgresql/postgresql.conf`), so anything
# not set here falls back to the compiled-in default, not to the image default.
# It is mounted read-only, which is fine: nothing here needs ALTER SYSTEM.
#
# Sizing assumption: ~512 MB of container memory, a handful of connections
# (GS_POSTGRES_MAX_CONNS=10 plus MarketMate's pool plus your psql), and an SSD.
# These are NOT production numbers — see the notes at the bottom.

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
listen_addresses = '*'
port = 5432

# Two app pools (10 + ~10) plus room for psql, migrations and the healthcheck.
# Each backend costs a process, so this is deliberately not 100.
max_connections = 50

# Reserve slots so a runaway app pool can never lock you out of your own server.
superuser_reserved_connections = 3

# ---------------------------------------------------------------------------
# Authentication — SCRAM everywhere.
# initdb was run with --auth-host=scram-sha-256 (see docker-compose.yml); this
# makes sure any role created *after* init also gets a SCRAM verifier.
# ---------------------------------------------------------------------------
password_encryption = 'scram-sha-256'

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# 128 MB = 25% of a 512 MB budget, the usual starting ratio.  Raising this on a
# laptop mostly buys nothing because the OS page cache is already holding the
# whole (tiny) dataset.
shared_buffers = 128MB

# Planner hint only — no memory is allocated.  Tells the planner roughly how
# much of the DB the OS is likely caching, which makes it prefer index scans.
effective_cache_size = 384MB

# Per sort/hash node, not per query: a query with 4 sorts can use 4x this.
# 8 MB is generous for these datasets and still bounded by max_connections.
work_mem = 8MB

# Used by CREATE INDEX and VACUUM.  Bigger here is cheap: only a few backends
# do maintenance at once, and it makes the boot-time migrations noticeably
# faster.
maintenance_work_mem = 64MB

# ---------------------------------------------------------------------------
# WAL / checkpoints
# Both databases are re-creatable from fixtures, so we trade a little crash
# durability for far less write amplification on a laptop SSD.
# ---------------------------------------------------------------------------
wal_level = replica
min_wal_size = 80MB
max_wal_size = 1GB

# Spread checkpoint I/O over 90% of the interval instead of spiking.
checkpoint_completion_target = 0.9

# synchronous_commit = off means a crash can lose the last ~200 ms of commits.
# That is acceptable for a dev database and removes an fsync from every write.
# NEVER ship this to production.
synchronous_commit = off

# ---------------------------------------------------------------------------
# Planner — SSD assumptions
# ---------------------------------------------------------------------------
# Default is 4.0, which models a spinning disk and pushes the planner towards
# sequential scans.  On SSD/overlayfs a random page is nearly as cheap as a
# sequential one.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------------------
# Logging — this is the part you will actually use while developing.
# ---------------------------------------------------------------------------
log_destination = 'stderr'
# Off: the container captures stderr, so `docker compose logs -f postgres`
# is the log viewer.  A collector would hide output inside the volume.
logging_collector = off

log_line_prefix = '%m [%p] %q%u@%d %a '
log_timezone = 'UTC'
timezone = 'UTC'

# SLOW QUERY LOG.  Anything taking longer than 200 ms against these datasets is
# a missing index or an accidental N+1 from the GraphQL resolver — both worth
# seeing immediately.  Set to 0 to log every statement while debugging, or -1
# to disable.
log_min_duration_statement = 200ms

# Log DDL only.  'all' is too noisy with two apps running migrations on boot;
# 'ddl' still shows you every CREATE/ALTER a migration performs.
log_statement = 'ddl'

# Attribute slow queries to a source: the apps should set application_name on
# their connections.
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on          # a query blocked >deadlock_timeout gets logged
log_temp_files = 1MB         # a spill to disk means work_mem is too small
log_autovacuum_min_duration = 1s

# ---------------------------------------------------------------------------
# Autovacuum — default on, slightly more eager.  The event ingest path churns
# rows fast enough that the stock 20% threshold lets bloat build up over a long
# dev session.
# ---------------------------------------------------------------------------
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ---------------------------------------------------------------------------
# Statistics
# ---------------------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on         # makes EXPLAIN (ANALYZE, BUFFERS) show real I/O time

# ---------------------------------------------------------------------------
# NOT FOR PRODUCTION
#   - synchronous_commit = off       (accepts data loss on crash)
#   - shared_buffers 128MB           (size to 25% of the real machine)
#   - max_connections 50 with no pooler (use pgbouncer past ~100)
#   - no ssl                         (terminate TLS at the server or the mesh)
#   - log_statement = 'ddl'          (prod wants 'none' plus pg_stat_statements)
# ---------------------------------------------------------------------------
