# Removes base/secret.yaml from the output. The values in it are fake and
# checked into git; applying them to a real cluster would set the Postgres
# superuser password to "postgres".
#
# In prod, `platform-secrets` is created out of band with the same KEYS and
# real values. Missing keys surface immediately as CreateContainerConfigError
# on the pods, which is the failure mode you want (loud, before traffic).
$patch: delete
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
