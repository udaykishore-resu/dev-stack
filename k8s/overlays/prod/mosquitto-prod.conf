# Mosquitto — PRODUCTION config. Replaces mosquitto/mosquitto.conf via the
# configMapGenerator `behavior: replace` in this overlay's kustomization.
#
# Differences from local, all of them deliberate:
#   * anonymous access refused
#   * every client authenticates against a password file (a Secret, not this
#     ConfigMap — hashes do not belong in a ConfigMap)
#   * an ACL confines each property gateway to its own topic subtree
#   * TLS listener on 8883; 1883 stays for in-cluster traffic only

listener 1883 0.0.0.0
protocol mqtt

listener 8883 0.0.0.0
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/tls.crt
keyfile  /mosquitto/certs/tls.key
tls_version tlsv1.2

listener 9001 0.0.0.0
protocol websockets

# THE production difference.
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

# Persistence on: a QoS 1 event that arrived while the ingest worker was
# restarting must survive a broker restart too. Backed by a PVC in a real
# deployment (this overlay leaves the emptyDir in place; swap it for a PVC
# before you rely on it).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

max_inflight_messages 100
max_queued_messages 10000
message_size_limit 262144
max_keepalive 120
