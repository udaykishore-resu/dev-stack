# NodePort Services for host access to the infra, matching the
# extraPortMappings in kind/cluster.yaml:
#
#   host 15432 -> nodePort 30432 -> postgres:5432
#   host 16379 -> nodePort 30379 -> redis:6379
#   host 19200 -> nodePort 30920 -> elasticsearch:9200
#   host 11883 -> nodePort 30883 -> mosquitto:1883
#
# These are SEPARATE Services, not a patch of the ones in base: `postgres` and
# `elasticsearch` are headless (clusterIP: None) so the StatefulSet pods get
# stable DNS, and a headless Service cannot have a NodePort. Adding a second
# Service is also the honest thing — it makes the host-access path visible in
# `kubectl get svc` instead of hiding it inside the app's own Service.
#
# Local only. There is no equivalent in overlays/prod, and there should not be.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  labels:
    app.kubernetes.io/name: postgres
    dev-stack.local/purpose: host-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nodeport
  labels:
    app.kubernetes.io/name: redis
    dev-stack.local/purpose: host-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: 30379
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-nodeport
  labels:
    app.kubernetes.io/name: elasticsearch
    dev-stack.local/purpose: host-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
      nodePort: 30920
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-nodeport
  labels:
    app.kubernetes.io/name: mosquitto
    dev-stack.local/purpose: host-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      nodePort: 30883
