apiVersion: v1
kind: Namespace
metadata:
  name: guest-platform
  labels:
    app.kubernetes.io/part-of: guest-platform
    # Enforce the restricted Pod Security Standard. Every workload below runs
    # non-root with all capabilities dropped, so this costs nothing and stops a
    # future manifest from quietly regressing.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
