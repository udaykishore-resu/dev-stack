# guest-score-scoring — pure gRPC, port 9090.
#
# Stateless and dependency-free: it takes a stay history and returns a score.
# No Postgres, no Redis, therefore no initContainer.
#
# guest-score-api reaches it at guest-score-scoring:9090 (GS_SCORING_GRPC).
# With that var empty the API computes scores in-process, so this Deployment
# is genuinely optional.
---
apiVersion: v1
kind: Service
metadata:
  name: guest-score-scoring
  labels:
    app.kubernetes.io/name: guest-score-scoring
    app.kubernetes.io/part-of: guest-score
spec:
  selector:
    app.kubernetes.io/name: guest-score-scoring
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
      # h2c hint for service meshes and for Gateway API implementations that
      # honour appProtocol; harmless to plain kube-proxy.
      appProtocol: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guest-score-scoring
  labels:
    app.kubernetes.io/name: guest-score-scoring
    app.kubernetes.io/component: grpc
    app.kubernetes.io/part-of: guest-score
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-score-scoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-score-scoring
        app.kubernetes.io/component: grpc
        app.kubernetes.io/part-of: guest-score
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scoring
          image: guest-score-scoring:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: guest-score-scoring-config
          # Native Kubernetes gRPC probes (GA since 1.27, beta 1.24). The
          # kubelet speaks grpc.health.v1.Health itself, so the image needs no
          # grpc_health_probe binary — which matters, because a distroless
          # image has no shell to exec one from anyway.
          startupProbe:
            grpc:
              port: 9090
              service: ""        # "" == overall server health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9090
              service: ""
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 9090
              service: ""
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Scoring is CPU-bound arithmetic over a bounded stay history;
              # memory stays flat, so a low limit is safe and catches leaks.
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
