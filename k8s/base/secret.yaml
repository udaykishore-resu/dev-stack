# ############################################################################
# FAKE LOCAL CREDENTIALS. NOT SECRET. DO NOT COPY TO A REAL CLUSTER.
#
# Every value below is the same throwaway string used by docker-compose and
# postgres/init/01-databases.sh, so a kind cluster comes up with no setup.
# They are checked into git on purpose: there is nothing here worth stealing.
#
# PRODUCTION does NOT use this file. overlays/prod deliberately does not
# include it; it expects the Secret named `platform-secrets` to already exist
# in the namespace, populated by a real secret store — External Secrets
# Operator, Vault Agent Injector, SOPS-encrypted manifests, or the cloud
# provider's CSI secret driver. See overlays/prod/README.md.
#
# `stringData` (not `data`) so the values stay readable and diffable; the API
# server base64-encodes them on write.
# ############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  labels:
    app.kubernetes.io/part-of: guest-platform
  annotations:
    dev-stack.local/warning: "fake local values - prod overlays use a real secret store"
type: Opaque
stringData:
  # --- PostgreSQL server -----------------------------------------------------
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  # --- per-application roles (consumed by the initdb script) -----------------
  GS_DB_PASSWORD: "guestscore"
  MM_DB_PASSWORD: "marketmate"

  # --- DSNs. In the Secret rather than the ConfigMap because they embed the
  #     password; splitting them would just mean building the URL in the app.
  GS_POSTGRES_DSN: "postgres://guestscore:guestscore@postgres:5432/guestscore?sslmode=disable"
  MM_POSTGRES_DSN: "postgres://marketmate:marketmate@postgres:5432/marketmate?sslmode=disable"

  # --- Redis. No password locally; the key exists so the env var is always
  #     defined and the app does not have to distinguish unset from empty.
  GS_REDIS_PASSWORD: ""

  # --- Elasticsearch. Empty because xpack.security is off in base/local.
  #     Prod sets these to the real `elastic`-realm credentials.
  GS_ELASTIC_PASSWORD: ""
  # NOTE: MM_ELASTIC_PASSWORD is NOT in contract.md — the contract gives
  # MarketMate MM_ELASTIC_URL and MM_ELASTIC_INDEX but no credential vars,
  # while Guest Score gets GS_ELASTIC_USERNAME/PASSWORD. That is a gap: the
  # prod overlay turns xpack.security on, and MarketMate then has no way to
  # authenticate. The key is defined here so the wiring exists; the Go side
  # needs the matching var before it does anything.
  MM_ELASTIC_PASSWORD: ""

  # --- MQTT. Empty because the local broker is allow_anonymous.
  #     Prod's mosquitto uses a password_file; these must match an entry in it.
  GS_MQTT_PASSWORD: ""

  # --- HMAC key for guest document hashes. A fixed dev value means the demo
  #     dataset hashes identically on every machine, which makes fixtures
  #     comparable. In prod this MUST be a high-entropy random key: rotating it
  #     invalidates every previously issued guest_global_id.
  GS_IDENTITY_KEY: "dev-only-not-a-real-hmac-key-0000000000"

  # --- Third-party providers. Empty is correct: USE_FIXTURES=true means
  #     MarketMate never calls out, and an empty key is the documented
  #     "fixtures please" signal.
  OPENAI_API_KEY: ""
  GOOGLE_MAPS_API_KEY: ""
  YOUTUBE_API_KEY: ""
