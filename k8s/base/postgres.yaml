# PostgreSQL — StatefulSet, because the data directory is not disposable and
# the pod needs a stable identity for its PVC.
#
# One instance, two databases, created by the same init script the compose
# stack uses (mounted from a ConfigMap generated by kustomize).
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  # Headless: gives the StatefulSet pod a stable DNS name
  # (postgres-0.postgres.guest-platform.svc). The plain `postgres` name still
  # resolves to the pod IP, which is what the contract's DSNs use.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # uid/gid 70 is `postgres` in postgres:17-alpine. Running as that user
        # directly (rather than letting the entrypoint step down from root)
        # keeps the pod inside the restricted Pod Security Standard.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        # fsGroup makes the kubelet chgrp the PVC on mount, otherwise uid 70
        # cannot write to a freshly provisioned volume.
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # PGDATA must be a SUBDIRECTORY of the mount point: a PVC root
            # often contains lost+found, and initdb refuses a non-empty dir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
            # Read by 01-databases.sh, not by postgres.
            - name: GS_DB_USER
              value: guestscore
            - name: GS_DB_NAME
              value: guestscore
            - name: GS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: GS_DB_PASSWORD }
            - name: MM_DB_USER
              value: marketmate
            - name: MM_DB_NAME
              value: marketmate
            - name: MM_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: MM_DB_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: pgconf
              mountPath: /etc/postgresql
              readOnly: true
            # The entrypoint puts the unix socket here and writes a lock file;
            # with a read-only root filesystem it needs a real writable mount.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          # startupProbe carries the slow path: initdb plus the init script on a
          # first boot can take 30-60s on a laptop. The liveness probe is only
          # armed once this succeeds, so a slow init cannot cause a restart loop.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -q -U \"$POSTGRES_USER\" -d postgres -h 127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -q -U \"$POSTGRES_USER\" -d postgres -h 127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Deliberately more forgiving than readiness: a checkpoint storm
            # should drop the pod out of the Service, not kill the database.
            exec:
              command: ["sh", "-c", "pg_isready -q -U \"$POSTGRES_USER\" -h 127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # 512Mi covers shared_buffers 128MB + 50 backends * work_mem
              # worst case is theoretically higher, but real dev usage sits
              # around 250Mi. Postgres is not OOM-friendly, so do not go lower.
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
            # 493 == 0555 octal (r-xr-xr-x). Written in decimal because the
            # octal literal is parsed differently by YAML 1.1 and 1.2 loaders.
            defaultMode: 493
        - name: pgconf
          configMap:
            name: postgres-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Overridden per overlay: 1Gi local, 20Gi prod.
            storage: 5Gi
