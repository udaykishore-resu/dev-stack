# Redis — Deployment, not StatefulSet.
#
# It is a cache. Every key is derivable from Postgres or Elasticsearch and
# every read path in both apps tolerates a miss (contract.md's fallback table:
# unset GS_REDIS_ADDR degrades to a no-op cache). There is nothing to keep, so
# there is no PVC and no stable identity to preserve — an emptyDir and a
# rolling replace are exactly right.
#
# Guest Score uses logical DB 0, MarketMate uses DB 1.
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Redis pods behind one Service would
    # split the keyspace at random and produce phantom cache misses during
    # every rollout. Losing the cache for a few seconds is free.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # `redis` in redis:7-alpine
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            # No RDB snapshots and no AOF: nothing here is worth persisting,
            # and a stale dump outliving a schema change is a real source of
            # "impossible" bugs.
            - --save
            - ""
            - --appendonly
            - "no"
            # Must stay below the container memory limit with headroom for
            # Redis' own allocator overhead (~20%).
            - --maxmemory
            - 192mb
            # Evict rather than start returning OOM to the apps.
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # A TCP check would pass while Redis is blocked; PING proves the
            # event loop is actually serving.
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              # 256Mi = 192mb maxmemory + allocator overhead + the process.
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # emptyDir, not a PVC. redis-server still wants a writable working
        # directory even with persistence disabled.
        - name: data
          emptyDir:
            sizeLimit: 256Mi
