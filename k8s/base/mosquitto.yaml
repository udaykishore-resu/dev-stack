# Mosquitto — Deployment. Persistence is off (see mosquitto/mosquitto.conf),
# so there is no volume and nothing that needs a stable pod identity.
#
# The config comes from a ConfigMap generated by kustomize out of
# ../../mosquitto/mosquitto.conf, so the compose stack and the cluster read
# byte-identical broker config. overlays/prod replaces it.
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: broker
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: websocket
      port: 9001
      targetPort: websocket
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  strategy:
    # Recreate: two brokers behind one Service do not share state, so half the
    # subscribers would silently miss half the events during a rolling update.
    # Clustering MQTT needs a real broker (EMQX/VerneMQ), not two mosquittos.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/component: broker
      annotations:
        # Roll the pod when the broker config changes; mosquitto does not
        # reload listeners on SIGHUP. kustomize's configMap name suffix hash
        # already forces this, but the annotation makes the reason explicit.
        checksum/config: kustomize-hashes-the-configmap-name
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883         # `mosquitto` in eclipse-mosquitto:2
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          args: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
            - name: websocket
              containerPort: 9001
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            # The image expects these to exist and be writable even with
            # persistence off.
            - name: data
              mountPath: /mosquitto/data
            - name: logs
              mountPath: /mosquitto/log
          startupProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            # -E exits on SUBACK, so this proves the broker accepts
            # subscriptions rather than merely holding the TCP port open.
            exec:
              command:
                - sh
                - -c
                - mosquitto_sub -h 127.0.0.1 -p 1883 -t '$SYS/broker/uptime' -i k8s-readiness -E -W 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              # Bounded by max_queued_messages (1000) * message_size_limit
              # (256KB) worst case; in practice it sits under 20Mi.
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
