# Mosquitto 2.x — LOCAL DEVELOPMENT CONFIG.
#
# Mosquitto 2.0 changed the default: with no config it binds 127.0.0.1 only and
# refuses anonymous clients.  Inside a container that means "nothing can ever
# connect", which is why this file exists at all.
#
# Everything here assumes the broker is reachable only from the compose network
# and from 127.0.0.1 on the host.  Do not port-forward 1883 anywhere.
# The production settings are at the bottom, commented, with the exact commands.

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------

# Plain MQTT — this is what GS_MQTT_URL=tcp://mosquitto:1883 talks to.
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets — for browser clients and for MQTT Explorer / mqttx in
# the browser.  The Go ingest worker does not use it.
listener 9001 0.0.0.0
protocol websockets

# ---------------------------------------------------------------------------
# Authentication — ANONYMOUS, LOCAL ONLY
#
# Every publisher in dev is either the Go ingest worker or a human with
# mosquitto_pub.  Adding credentials here buys nothing and costs a password
# file that has to be regenerated whenever someone rebuilds the stack.
# ---------------------------------------------------------------------------
allow_anonymous true

# ---------------------------------------------------------------------------
# Persistence — OFF
#
# The only retained messages on this bus are the guestscore/{property}/status
# LWTs ("online"/"offline").  Those are cheap to re-publish and a stale
# retained "online" surviving a restart is actively confusing: you would see a
# property reporting healthy when nothing is connected.  QoS 1 in-flight
# messages are likewise not worth persisting for a dev broker.
# ---------------------------------------------------------------------------
persistence false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# Uncomment to watch every subscription and publish while debugging the
# ingest worker's topic filter (guestscore/+/events):
# log_type subscribe
# log_type unsubscribe
# log_type debug
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---------------------------------------------------------------------------
# Limits
# ---------------------------------------------------------------------------
# QoS 1 with dedup by event_id (contract.md) means redelivery is safe, so a
# modest in-flight window is fine.
max_inflight_messages 40
max_queued_messages 1000
# Event payloads are small JSON documents; 256 KB is already 100x the largest.
message_size_limit 262144

# Keepalive: reject clients asking for an absurd keepalive so a dead property
# gateway is detected within ~90 s and its LWT fires.
max_keepalive 120

# ---------------------------------------------------------------------------
# PRODUCTION — do not enable locally. The live version of this is
# k8s/overlays/prod/mosquitto-prod.conf, which the prod overlay swaps in via
# `configMapGenerator: behavior: replace`.
#
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#   acl_file      /mosquitto/config/acl
#
#   listener 8883 0.0.0.0
#   protocol mqtt
#   cafile   /mosquitto/certs/ca.crt
#   certfile /mosquitto/certs/server.crt
#   keyfile  /mosquitto/certs/server.key
#   require_certificate false
#   tls_version tlsv1.2
#
# Generating the password file (the file is hashed in place, so generate it
# into a scratch dir and mount the result as a Secret):
#
#   docker run --rm -it -v "$PWD/secrets:/s" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /s/passwd guest-score-ingest 'REDACTED'
#   docker run --rm -it -v "$PWD/secrets:/s" eclipse-mosquitto:2 \
#     mosquitto_passwd -b /s/passwd prop_mum_01 'REDACTED'
#
#   kubectl -n guest-platform create secret generic mosquitto-passwd \
#     --from-file=passwd=secrets/passwd
#
# ACL sketch matching the contract's topic scheme — a property gateway may
# publish only under its own property id, and only the backend may write acks:
#
#   user guest-score-ingest
#   topic read  guestscore/+/events
#   topic read  guestscore/+/status
#   topic write guestscore/_bureau/acks
#
#   user prop_mum_01
#   topic write guestscore/prop_mum_01/events
#   topic write guestscore/prop_mum_01/status
#   topic read  guestscore/_bureau/acks
# ---------------------------------------------------------------------------
